<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ESP32 FX</title>
<style>
:root{--bg:#10141d;--panel:#1d2535;--panel2:#2a3449;--line:#3a4660;--text:#eef1f7;--muted:#97a3bb;--acc:#f0b441;--teal:#46d3c0;--red:#ef5b5b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#05070b;color:var(--text);font-family:"Vazirmatn","Vazir",Tahoma,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;cursor:pointer}
svg.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* home menu */
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:3px;min-height:0}
.tile{position:relative;border:0;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,1.2vh,8px);padding:4px}
.tile:active{filter:brightness(.88)}
.tile svg.i{width:clamp(30px,17vh,76px);height:clamp(30px,17vh,76px)}
.tile .n{font-size:clamp(13px,4.6vh,22px);font-weight:700;line-height:1.2;text-align:center}
.tile .e{font-size:clamp(9px,3vh,13px);opacity:.9;direction:ltr;text-align:center}
.tile .led{position:absolute;top:10px;inset-inline-start:10px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.tile.on .led{background:#fff;box-shadow:0 0 7px #fff}
.tile:not(.on):not(.sys){opacity:.5}

/* pages */
.hd{display:flex;align-items:center;gap:12px;padding:6px 14px;min-height:clamp(42px,14vh,58px);background:var(--c);color:#fff;flex:none}
.hd h1{font-size:clamp(16px,5vh,22px);font-weight:700;line-height:1.1}
.hd small{display:block;font-size:11px;opacity:.85;direction:ltr;text-align:start}
.hd svg.i{width:30px;height:30px}
.hd .sp{flex:1}
.back{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);display:grid;place-items:center}
.back svg{width:22px;height:22px}
html[dir=ltr] .back svg{transform:scaleX(-1)}
.cn{display:flex;align-items:center;gap:6px;font-size:11px;background:rgba(0,0,0,.25);border-radius:99px;padding:4px 10px}
.cn i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.cn.ok i{background:#5dff9a}
.body{flex:1;overflow:auto;padding:12px 16px 16px;min-height:0;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.card{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.row{min-width:0}
.lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:8px}
.lab b{direction:ltr;color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;direction:ltr;background:linear-gradient(to right,var(--acc) var(--p,50%),var(--line) var(--p,50%));touch-action:pan-y;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--bg)}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.sw{width:50px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed=true]{background:var(--teal)}
.sw[aria-pressed=true]::after{transform:translateX(22px)}
html[dir=rtl] .sw[aria-pressed=true]::after{transform:translateX(-22px)}
.hd .sw{background:rgba(0,0,0,.3)}
.hd .sw[aria-pressed=true]{background:#fff}
.hd .sw[aria-pressed=true]::after{background:var(--c)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;direction:ltr}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:13px;min-width:0}
.seg button.a{background:var(--panel2);color:var(--text)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--panel2);color:var(--text);font-size:14px}
.btn:active{background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;direction:ltr;color:var(--teal)}
.cap{font-size:12px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;direction:ltr}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--teal) 0 65%,#f0b441 65% 88%,var(--red) 88%);background-size:100% 100%}
.mt{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:11px;color:var(--muted);direction:ltr}
.gr .bar>div{background:var(--acc);margin-left:auto}
.gr .bar{direction:rtl}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.info div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--muted)}
.info b{display:block;font-size:16px;color:var(--text);direction:ltr;text-align:start;font-weight:600}
.clip{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.clip.h{background:var(--red)}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:15px;direction:ltr}
.lang{display:flex;flex-wrap:wrap;gap:8px}
.lang button{border:1px solid var(--line);background:none;border-radius:10px;padding:9px 14px;font-size:14px}
.lang button.a{background:var(--acc);color:#10141d;border-color:var(--acc);font-weight:700}

/* eq */
.eq{display:flex;justify-content:space-between;direction:ltr;gap:2px}
.band{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);touch-action:none}
.bt{position:relative;width:100%;height:clamp(110px,34vh,200px);cursor:ns-resize}
.bt::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:var(--line)}
.bt .z{position:absolute;left:25%;right:25%;top:50%;height:1px;background:var(--muted);opacity:.6}
.bt .f{position:absolute;left:50%;width:4px;margin-left:-2px;background:var(--acc);border-radius:2px}
.bt .k{position:absolute;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:4px solid var(--bg)}
.band em{font-style:normal;color:var(--acc);font-variant-numeric:tabular-nums}
.curve{width:100%;height:46px;display:block;margin-bottom:6px}
.rot{position:fixed;inset:0;background:#05070b;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;z-index:9}
@media (orientation:portrait){.rot{display:flex}}
</style>
</head>

    if(k==='m'){meters(v.split(',').map(Number));return}
    if(k==='a.list'){afbList=v?v.split(',').map(Number):[];if(page==='afb')renderChips();return}
    if(k==='fw'){fw=v;return}
    V[k]=parseFloat(v);
    if(/\.(on|type|mode|pp)$/.test(k))rerender=true;else sync.push(k);
  });
  if(page==='home'||rerender)render();else sync.forEach(syncKey);
}
function updConn(){
  document.querySelectorAll('.cn').forEach(e=>{e.classList.toggle('ok',conn);e.lastChild.textContent=conn?t('conn'):t('disc')});
  const st=$('#st');if(st)st.textContent=conn?t('conn')+' · '+host:t('disc');
}

/* ============================== UI building blocks ============================== */
const fmtv=(v,step,unit)=>(step<1?Number(v).toFixed(1):Math.round(v))+(unit||'');
function sl(key,label,min,max,step,unit){
  const v=V[key];
  return `<div class="row"><div class="lab"><span>${label}</span><b data-v="${key}">${fmtv(v,step,unit)}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" style="--p:${(v-min)/(max-min)*100}%" data-k="${key}" data-u="${unit||''}" data-s="${step}" aria-label="${label}"></div>`;
}
const tg=(key,label)=>`<div class="row trow"><span>${label}</span><button class="sw" aria-pressed="${V[key]>0.5}" data-tg="${key}" aria-label="${label}"></button></div>`;
const seg=(key,opts)=>`<div class="seg">${opts.map((o,i)=>`<button class="${i==V[key]?'a':''}" data-sg="${key}" data-o="${i}">${o}</button>`).join('')}</div>`;
const bar=id=>`<div class="bar"><div data-m="${id}"></div></div>`;
const typeName=n=>t(FXT[V['e'+n+'.type']|0]);
function head(p,pw){
  return `<div class="hd" style="--c:${COL[p]}"><button class="back" data-go="home" aria-label="back">${svg('back')}</button>${svg(p)}<div><h1>${t(p)}</h1></div><span class="sp"></span><div class="cn ${conn?'ok':''}"><i></i><span>${conn?t('conn'):t('disc')}</span></div>${pw?`<button class="sw" aria-pressed="${V[pw]>0.5}" data-tg="${pw}" aria-label="on/off"></button>`:''}</div>`;
}

/* ============================== pages ============================== */
function home(){
  return `<div class="grid">${ORDER.map(p=>{
    let sub='',on=true;
    if(p==='fx1'||p==='fx2'){const n=p[2];on=V['e'+n+'.on']>0.5;sub=typeName(n)}
    else if(p==='eq'){on=V['eq.on']>0.5;sub='10-Band EQ'}
    else if(p==='comp'){on=V['c.on']>0.5;sub='Compressor'}
    else if(p==='lim'){on=V['l.on']>0.5;sub='Limiter'}
    else if(p==='afb'){on=V['a.on']>0.5;sub='Anti-Feedback'}
    else if(p==='io'){sub='PCM1808 · PCM5102'}
    else if(p==='set'){sub=''}
    return `<button class="tile ${on?'on':''} ${p==='io'||p==='set'?'sys':''}" style="--c:${COL[p]}" data-go="${p}"><i class="led"></i>${svg(p)}<span class="n">${t(p)}</span><span class="e" ${p==='set'?'id="st"':''}>${p==='set'?(conn?t('conn')+' · '+host:t('disc')):sub}</span></button>`}).join('')}</div>`;
}
function fxPage(n){
  const ty=V['e'+n+'.type']|0,pre='e'+n+'.'+FXT[ty]+'.';
  const sp=SP[FXT[ty]];
  let h=head('fx'+n,'e'+n+'.on')+`<div class="body">${seg('e'+n+'.type',FXT.map(x=>t(x)))}<div class="cols">`;
  sp.forEach(p=>{h+=p.length===1?tg(pre+p[0],t('p_'+p[0])):sl(pre+p[0],t('p_'+p[0]),p[1],p[2],p[3],p[4])});
  h+='</div>';
  if(ty===2)h+=`<div style="margin-top:12px"><button class="btn" data-tap="${pre}time">${t('tap')}</button></div>`;
  return h+'</div>';
}
function eqPage(){
  const F=['31','62','125','250','500','1k','2k','4k','8k','16k'];
  return head('eq','eq.on')+`<div class="body"><div class="card"><svg class="curve" id="curve" viewBox="0 0 300 46" preserveAspectRatio="none"><line x1="0" y1="23" x2="300" y2="23" stroke="#3a4660"/><path id="cpath" fill="none" stroke="${COL.eq}" stroke-width="2.5"/></svg><div class="eq">${F.map((f,i)=>`<div class="band" data-b="${i}"><em></em><div class="bt"><div class="f"></div><div class="z"></div><div class="k"></div></div><span>${f}</span></div>`).join('')}</div></div><div class="cap" style="text-align:center">${t('eqhint')}</div></div>`;
}
function compPage(){
  return head('comp','c.on')+`<div class="body"><div class="cols"><div>${sl('c.thr',t('thr'),-60,0,1,' dB')}${sl('c.ratio',t('ratio'),1,20,0.5,' :1')}${sl('c.mk',t('mk'),0,18,0.5,' dB')}</div><div>${sl('c.att',t('att'),1,200,1,' ms')}${sl('c.rel',t('rel'),10,1000,5,' ms')}
  <svg viewBox="0 0 100 100" style="width:100%;height:clamp(60px,22vh,110px);background:var(--panel);border-radius:10px;margin-top:6px"><path d="M0 100L100 0" stroke="#3a4660" stroke-dasharray="3 3" fill="none"/><path id="tc" stroke="${COL.comp}" stroke-width="2.5" fill="none"/></svg>
  <div class="mt gr" style="margin-top:10px"><span>${t('gr')}</span>${bar('gr')}</div></div></div></div>`;
}
function limPage(){
  return head('lim','l.on')+`<div class="body"><div class="cols"><div>${sl('l.ceil',t('ceil'),-12,0,0.5,' dB')}${sl('l.rel',t('rel'),10,500,5,' ms')}</div><div>${sl('l.gain',t('lgain'),0,12,0.5,' dB')}<div class="mt" style="margin-top:14px"><span>OUT</span>${bar('out')}<span>${t('gr')}</span><div class="gr"><div class="bar"><div data-m="gr"></div></div></div></div><div style="margin-top:10px"><span class="clip" id="clip"></span></div></div></div></div>`;
}
function afbPage(){
  return head('afb','a.on')+`<div class="body"><div class="cols"><div>${seg('a.mode',[t('auto'),t('manual')])}${sl('a.sens',t('sens'),0,100,1,' %')}${sl('a.n',t('nn'),1,12,1,'')}${sl('a.depth',t('depth'),3,24,1,' dB')}</div><div><div class="card"><div class="cap">${t('notches')}</div><div class="chips" id="chips"></div></div><button class="btn" data-clr="1">${t('clear')}</button></div></div></div>`;
}
function ioPage(){
  return head('io')+`<div class="body"><div class="cols"><div>${sl('g.ing',t('ing'),-12,12,0.5,' dB')}${sl('g.vol',t('vol'),0,100,1,' %')}${tg('g.mute',t('mute'))}</div><div><div class="mt"><span>IN</span>${bar('in')}<span>OUT</span>${bar('out')}</div><div class="info" style="margin-top:14px;grid-template-columns:1fr 1fr"><div>${t('rate')}<b>48 kHz</b></div><div>${t('cpu')}<b id="cpu">${cpu} %</b></div><div>${t('buf')}<b>64 · 1.3 ms</b></div><div>${t('bits')}<b>24 / 32 bit</b></div></div></div></div></div>`;
}
function setPage(){
  return head('set')+`<div class="body"><div class="cols"><div><div class="card"><div class="cap">${t('lang')}</div><div class="lang">${Object.keys(LANGS).map(k=>`<button class="${k==lang?'a':''}" data-lang="${k}">${LANGS[k]}</button>`).join('')}</div></div>
  <div class="card"><div class="cap">${t('addr')}</div><input class="inp" id="host" value="${host}" inputmode="decimal" aria-label="${t('addr')}"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-conn="1">${t('connect')}</button><button class="btn" data-wifi="1">${t('wifi')}</button></div><div class="cap" style="margin-top:10px" id="st">${conn?t('conn')+' · '+host:t('disc')}</div></div></div>
  <div><div class="card"><div class="cap">${t('wifihint')} (ESP32-FX)</div><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" data-save="1">${t('save')}</button><button class="btn" data-reset="1">${t('reset')}</button></div><div class="cap" style="margin-top:12px;direction:ltr;text-align:start">FW ${fw||'-'}</div></div></div></div></div>`;
}

/* ============================== render ============================== */
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=RTL[lang]?'rtl':'ltr';
  $('#rot').textContent=t('rot');
  const f={home,fx1:()=>fxPage(1),fx2:()=>fxPage(2),eq:eqPage,comp:compPage,lim:limPage,afb:afbPage,io:ioPage,set:setPage}[page];
  $('#app').innerHTML=f();
  $('#app').style.setProperty('--acc',COL[page]||'#f0b441');
  if(page==='eq')for(let i=0;i<10;i++)setBand(i,V['eq.'+i],false);
  if(page==='comp')curveComp();
  if(page==='afb')renderChips();
}
function go(p){page=p;render()}
function syncKey(k){
  const el=document.querySelector(`[data-k="${k}"]`);
  if(el){el.value=V[k];const mn=+el.min,mx=+el.max;el.style.setProperty('--p',((V[k]-mn)/(mx-mn)*100)+'%');
    const b=document.querySelector(`[data-v="${k}"]`);if(b)b.textContent=fmtv(V[k],+el.dataset.s,el.dataset.u)}
  const m=/^eq\.(\d)$/.exec(k);if(m&&page==='eq')setBand(+m[1],V[k],false);
  if(page==='comp')curveComp();
}
function renderChips(){
  const c=$('#chips');if(!c)return;
  c.innerHTML=afbList.length?afbList.map(f=>`<span>${f>=1000?(f/1000).toFixed(2)+' kHz':f+' Hz'}</span>`).join(''):`<span style="color:var(--muted)">${t('none')}</span>`;
}
function curveComp(){
  const tc=$('#tc');if(!tc)return;
  const th=V['c.thr'],r=V['c.ratio'],mk=V['c.mk'],X=v=>(v+60)/60*100,Y=v=>100-Math.max(0,Math.min(100,(v+60)/60*100));
  tc.setAttribute('d',`M0 ${Y(-60+mk)}L${X(th)} ${Y(th+mk)}L100 ${Y(th+(0-th)/r+mk)}`);
}
/* EQ */
function setBand(i,v,send_){
  V['eq.'+i]=v;
  const b=document.querySelector(`[data-b="${i}"]`);if(!b)return;
  const y=(1-(v+12)/24)*100;
  b.querySelector('.k').style.top=y+'%';
  const fl=b.querySelector('.f');fl.style.top=Math.min(y,50)+'%';fl.style.height=Math.abs(y-50)+'%';
  b.querySelector('em').textContent=(v>0?'+':'')+(Number.isInteger(v)?v:v.toFixed(1));
  const pts=[];for(let j=0;j<10;j++)pts.push([15+j*30,23-V['eq.'+j]/12*19]);
  let d=`M${pts[0]}`;
  for(let j=0;j<9;j++){const p0=pts[j-1]||pts[j],p1=pts[j],p2=pts[j+1],p3=pts[j+2]||p2;
    d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
  const cp=$('#cpath');if(cp)cp.setAttribute('d',d);
  if(send_)send('eq.'+i,v);
}
let drag=null;
function eqMove(e){if(drag===null)return;const r=document.querySelector(`[data-b="${drag}"] .bt`).getBoundingClientRect();
  setBand(drag,Math.round(Math.max(-12,Math.min(12,(0.5-(e.clientY-r.top)/r.height)*24))*2)/2,true)}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.band');if(b){drag=+b.dataset.b;eqMove(e)}});
document.addEventListener('pointermove',eqMove);
document.addEventListener('pointerup',()=>{drag=null});
document.addEventListener('dblclick',e=>{const b=e.target.closest('.band');if(b)setBand(+b.dataset.b,0,true)});

/* ============================== events ============================== */
document.addEventListener('input',e=>{
  const r=e.target;if(r.type!=='range')return;
  const v=parseFloat(r.value);
  r.style.setProperty('--p',((v-r.min)/(r.max-r.min)*100)+'%');
  const b=document.querySelector(`[data-v="${r.dataset.k}"]`);if(b)b.textContent=fmtv(v,+r.dataset.s,r.dataset.u);
  send(r.dataset.k,v);
  if(page==='comp')curveComp();
});
let tapT=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.go){go(d.go);return}
  if(d.tg){const v=V[d.tg]>0.5?0:1;send(d.tg,v);b.setAttribute('aria-pressed',v>0.5);if(/\.on$/.test(d.tg)&&page==='home')render();return}
  if(d.sg){send(d.sg,+d.o);render();return}
  if(d.lang){lang=d.lang;store.set('fx.lang',lang);render();return}
  if(d.tap){const n=performance.now();if(tapT&&n-tapT<2000){const ms=Math.max(0,Math.min(2000,Math.round((n-tapT)/10)*10));send(d.tap,ms);render()}tapT=n;return}
  if(d.clr){sendRaw('a.clear=1');afbList=[];renderChips();return}
  if(d.conn){host=($('#host').value||'192.168.4.1').trim();store.set('fx.host',host);connect();return}
  if(d.wifi){if(window.Android&&Android.openWifiSettings)Android.openWifiSettings();return}
  if(d.save){sendRaw('save=1');return}
  if(d.reset){Object.assign(V,DEF);sendRaw('reset=1');render();return}
});
window.__back=()=>{if(page!=='home'){go('home');return true}return false};

/* ============================== meters ============================== */
function meters(a){
  const [inl,outl,gr,c]=a;cpu=c;
  document.querySelectorAll('[data-m]').forEach(el=>{
    const id=el.dataset.m;
    el.style.width=(id==='in'?inl*100:id==='out'?outl*100:Math.min(1,gr/24)*100)+'%'});
  const cl=$('#clip');if(cl)cl.classList.toggle('h',outl>0.985);
  const cp=$('#cpu');if(cp)cp.textContent=c+' %';
}

render();
connect();
</script>
</body>
</html>
